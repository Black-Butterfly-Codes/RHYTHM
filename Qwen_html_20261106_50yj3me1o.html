<section style="max-width: 800px; margin: 0 auto; padding: 40px 20px; display: flex; flex-direction: column; gap: 24px;">
  <h2 style="font-size: 28px; margin: 0;">Privacy & Data</h2>
  
  <div class="glass-card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h3 style="margin: 0 0 4px; font-size: 18px;">Analytics Consent</h3>
        <p style="margin: 0; color: var(--text-secondary);">Currently: <strong style="color: var(--text-primary);">Opted Out</strong></p>
      </div>
      <button class="btn-outline">Manage Preferences</button>
    </div>
  </div>
  
  <div class="glass-card">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h3 style="margin: 0 0 4px; font-size: 18px;">Data Export</h3>
        <p style="margin: 0; color: var(--text-secondary);">Download all your RHYTHM data as JSON.</p>
      </div>
      <!-- Primary Button with Violet Glow -->
      <button class="btn-primary glow-violet">Export Data</button>
    </div>
  </div>
  
  <div class="glass-card" style="border-color: rgba(239, 68, 68, 0.2);">
    <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
      <div>
        <h3 style="margin: 0 0 4px; font-size: 18px; color: #EF4444;">Delete Account</h3>
        <p style="margin: 0; color: var(--text-secondary);">Permanently delete your account and data.</p>
      </div>
      <button class="btn-outline" style="border-color: rgba(239, 68, 68, 0.3); color: #EF4444;">Delete</button>
    </div>
  </div>
</section>
