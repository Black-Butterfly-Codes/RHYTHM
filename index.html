  <script>
    /* Apply the saved theme before first paint (no flash, no network). */
    try {
      var t = localStorage.getItem("rhythm_theme_v1");
      if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
    } catch (e) { /* storage may be blocked */ }
  </script>

      <h1>RHYTHM</h1>
      <p><strong>Discover Talent. Create Together. Rise Together.</strong></p>
      <p>RHYTHM needs JavaScript to run. It is a client-side prototype: all demo data stays in your own browser and nothing is uploaded to a server.</p>
