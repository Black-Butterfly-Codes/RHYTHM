<section style="padding: var(--space-xl) 0;">
  <div style="max-width: 800px; margin: 0 auto; padding: 0 var(--space-md);">
    <div class="card" style="background: var(--paper); text-align: center;">
      <div class="avatar" style="margin: 0 auto var(--space-md);">M</div>
      <h2 style="margin: 0;">Minor Two</h2>
      <p style="color: var(--olive); font-weight: 700; margin: var(--space-sm) 0;">@minortwo</p>
      
      <div style="display: flex; justify-content: center; gap: var(--space-sm); margin: var(--space-md) 0; flex-wrap: wrap;">
        <span class="chip chip-active">Lyricist</span>
        <span class="chip">Dehradun, AP</span>
      </div>
      
      <div class="chip chip-success" style="margin-top: var(--space-md);">

    <!-- Reports History -->
    <div class="card" style="background: var(--paper); margin-top: var(--space-lg);">
      <h3>Report History</h3>
      <div style="border-top: 2px solid var(--ink); padding-top: var(--space-md); margin-top: var(--space-md);">
        <p style="margin: 0; font-weight: 700;">Copyright / plagiarism claim</p>
        <p style="margin: 4px 0 0; color: var(--olive);">Status: Dismissed</p>
      </div>
    </div>
